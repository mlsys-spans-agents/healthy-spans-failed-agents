{
 "receivers": {
  "otlp": {
   "protocols": {
    "http": {
     "endpoint": "0.0.0.0:4318"
    }
   }
  }
 },
 "processors": {
  "tail_sampling": {
   "decision_wait": "300s",
   "num_traces": 200000,
   "decision_cache": {
    "sampled_cache_size": 200000,
    "non_sampled_cache_size": 200000
   },
   "policies": [
    {
     "name": "outcome",
     "type": "string_attribute",
     "string_attribute": {
      "key": "app.outcome",
      "values": [
       "fail"
      ]
     }
    }
   ]
  }
 },
 "exporters": {
  "otlphttp": {
   "endpoint": "http://host.docker.internal:24525",
   "compression": "none",
   "encoding": "proto"
  }
 },
 "service": {
  "telemetry": {
   "metrics": {
    "level": "detailed",
    "readers": [
     {
      "pull": {
       "exporter": {
        "prometheus": {
         "host": "0.0.0.0",
         "port": 8888
        }
       }
      }
     }
    ]
   }
  },
  "pipelines": {
   "traces": {
    "receivers": [
     "otlp"
    ],
    "processors": [
     "tail_sampling"
    ],
    "exporters": [
     "otlphttp"
    ]
   }
  }
 }
}